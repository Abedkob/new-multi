services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: multitenant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      NODE_ENV: production
      # Next's standalone server otherwise reads Docker's container-id HOSTNAME and binds only
      # to that address. Bind on every interface so Traefik and the local healthcheck can reach it.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/multitenant
      APP_DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:-app_password}@postgres:5432/multitenant
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_password}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "${AUTH_TRUST_HOST:-true}"
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL:-http://localhost:3000}
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      # The edge (Phase 7, D75). Defaults keep the pre-Phase-7 behaviour, so a deploy that
      # sets none of them behaves as it did. EDGE_HARDENING.md is the order to turn them on in.
      EDGE_TRUST_MODE: ${EDGE_TRUST_MODE:-off}
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET}
      EDGE_FORCE_HTTPS: ${EDGE_FORCE_HTTPS:-false}
      # Deliberately 0 here: HSTS is enabled by hand, last, and only in the environment (D74).
      EDGE_HSTS_MAX_AGE: ${EDGE_HSTS_MAX_AGE:-0}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      LICENSE_API_BASE_URL: ${LICENSE_API_BASE_URL:-https://rlcphqlmnacxhzrffhjg.supabase.co/functions/v1/license-api}
      LICENSE_PRODUCT_CODE: ${LICENSE_PRODUCT_CODE:-iloop-ecom-subscription}
      LICENSE_APPLICATION_VERSION: ${LICENSE_APPLICATION_VERSION:-0.1.0}
      LICENSE_PLATFORM: ${LICENSE_PLATFORM:-linux}
      LICENSE_API_TIMEOUT_MS: ${LICENSE_API_TIMEOUT_MS:-10000}
      LICENSE_ENCRYPTION_KEY: ${LICENSE_ENCRYPTION_KEY}
      LICENSE_HEARTBEAT_SECRET: ${LICENSE_HEARTBEAT_SECRET}
    # Dokploy/Traefik reaches the app over Docker's internal network. Publishing 3000 on the
    # VPS would collide with every other deployment that also runs a Next.js container.
    expose:
      - "3000"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true
