<!--
  The platform console's mark: many stores, one of them in hand (D76).

  Same two rules as assets/icon-admin.svg — an element with id="bg" for the background colour
  and a group with id="mark" for everything else — and scripts/build-icons.ts refuses to run
  without them. Read that file's comment for why.

  This is deliberately a different SILHOUETTE and a different HUE from the merchant mark, not
  the same drawing in another colour. Both apps can be installed on the same phone (§11.1), and
  an operator who taps the wrong one of two near-identical Home Screen icons is looking at
  another tenant's data before they notice. A grid against a shop front is hard to confuse at
  48px; indigo against near-black is hard to confuse at any size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect id="bg" width="512" height="512" fill="#4338ca" />
  <g id="mark">
    <!-- One store, selected: the console's whole job is acting on a single tenant. -->
    <rect x="96" y="96" width="144" height="144" rx="32" fill="#ffffff" />
    <!-- The rest of them. -->
    <rect
      x="272"
      y="96"
      width="144"
      height="144"
      rx="32"
      fill="none"
      stroke="#ffffff"
      stroke-width="30"
    />
    <rect
      x="96"
      y="272"
      width="144"
      height="144"
      rx="32"
      fill="none"
      stroke="#ffffff"
      stroke-width="30"
    />
    <rect
      x="272"
      y="272"
      width="144"
      height="144"
      rx="32"
      fill="none"
      stroke="#ffffff"
      stroke-width="30"
    />
  </g>
</svg>
